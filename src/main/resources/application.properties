# Nombre de la aplicación
spring.application.name=Usuarios_Backend

# Configuración de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/db_backend_users
spring.datasource.username=root
spring.datasource.password=sasa1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración avanzada de Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Configuración del servidor
server.port=8080

# Configuración de Swagger-UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Configuración de logs
logging.level.com.vahor.Usuarios_Backend=DEBUG

# Configuración JWT
jwt.secret=miClaveSecretaParaJWT2024BackendUsuariosVAHOR
jwt.expiration=86400000

# Configuración CORS para Vue frontend
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8081
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Deshabilitar open-in-view para evitar problemas en producción
spring.jpa.open-in-view=false

# Configuración de logs específica para REST API
logging.level.com.vahor.Usuarios_Backend=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Configuración de JSON
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false

# Configuración para manejar CORS en desarrollo
# En producción, deberías configurar los orígenes específicos
server.servlet.context-path=/